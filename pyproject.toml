[project]
name = "lupus-ml"
version = "1.0.0"
description = "Interpretable ML classifier for SLE from interferon-stimulated gene expression"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "venv", "models", "figures", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by black

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Data-science scripts are loosely typed by nature (numpy/pandas/sklearn
# arrays); this project opts in to gradual typing rather than strict mode.
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
